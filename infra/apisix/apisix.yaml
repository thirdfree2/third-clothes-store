consumers:
  - username: auth-service
    plugins:
      jwt-auth:
        key: auth-service
        secret: super-secret-dev-key
        algorithm: HS256
        key_claim_name: iss

global_rules:
  - id: cors
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,Accept,Origin"
        expose_headers: "Authorization,Content-Type"
        max_age: 3600
        allow_credential: false

routes:
  # PUBLIC: ไม่ใส่ jwt-auth
  - id: cors-preflight
    uri: /api/v1/*
    priority: 1000
    methods:
      - OPTIONS
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,Accept,Origin"
        expose_headers: "Authorization,Content-Type"
        max_age: 3600
        allow_credential: false
    upstream:
      type: roundrobin
      nodes:
        "auth-service:8080": 1

  - id: auth-login
    uri: /api/v1/auth/login
    methods:
      - POST
    upstream:
      type: roundrobin
      nodes:
        "auth-service:8080": 1

  - id: auth-register
    uri: /api/v1/auth/register
    methods:
      - POST
    upstream:
      type: roundrobin
      nodes:
        "auth-service:8080": 1

  - id: auth-health
    uri: /auth/health
    upstream:
      type: roundrobin
      nodes:
        "auth-service:8080": 1

  - id: clothing-health
    uri: /clothing/health
    upstream:
      type: roundrobin
      nodes:
        "clothing-service:8080": 1

  - id: user-health
    uri: /user/health
    upstream:
      type: roundrobin
      nodes:
        "user-service:8080": 1

  - id: user-me-private
    uri: /api/v1/me
    priority: 100
    methods:
      - GET
      - PATCH
    plugins:
      jwt-auth:
        key_claim_name: iss
        claims_to_verify:
          - exp
    upstream:
      type: roundrobin
      nodes:
        "user-service:8080": 1

  - id: user-cart-private
    uri: /api/v1/cart*
    priority: 100
    methods:
      - GET
      - POST
      - PATCH
      - DELETE
    plugins:
      jwt-auth:
        key_claim_name: iss
        claims_to_verify:
          - exp
    upstream:
      type: roundrobin
      nodes:
        "user-service:8080": 1

  - id: user-purchases-private
    uri: /api/v1/purchases*
    priority: 100
    methods:
      - GET
      - POST
    plugins:
      jwt-auth:
        key_claim_name: iss
        claims_to_verify:
          - exp
    upstream:
      type: roundrobin
      nodes:
        "user-service:8080": 1

  - id: clothing-list-public
    uri: /api/v1/clothes
    methods:
      - GET
    upstream:
      type: roundrobin
      nodes:
        "clothing-service:8080": 1

  - id: clothing-detail-public
    uri: /api/v1/clothes/*
    methods:
      - GET
    upstream:
      type: roundrobin
      nodes:
        "clothing-service:8080": 1

  - id: clothing-colors-private
    uri: /api/v1/colors*
    methods:
      - GET
    plugins:
      jwt-auth:
        key_claim_name: iss
        claims_to_verify:
          - exp
    upstream:
      type: roundrobin
      nodes:
        "clothing-service:8080": 1

  - id: clothing-categories-private
    uri: /api/v1/categories*
    methods:
      - GET
    plugins:
      jwt-auth:
        key_claim_name: iss
        claims_to_verify:
          - exp
    upstream:
      type: roundrobin
      nodes:
        "clothing-service:8080": 1

  - id: clothing-private-write
    uri: /api/v1/clothes*
    methods:
      - POST
      - PUT
      - DELETE
    plugins:
      jwt-auth:
        key_claim_name: iss
        claims_to_verify:
          - exp
    upstream:
      type: roundrobin
      nodes:
        "clothing-service:8080": 1
#END
